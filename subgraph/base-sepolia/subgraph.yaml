specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: SourceVault
    network: base-sepolia
    source:
      address: "0x552431953dd3F087557196A383c436ddAab665ab"
      abi: SourceVault
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Payment
        - ChainStats
      abis:
        - name: SourceVault
          file: ./abis/SourceVault.json
      eventHandlers:
        - event: PaymentRequested(indexed address,indexed address,uint256,uint256,uint256)
          handler: handlePaymentRequested
      file: ./src/mapping.ts
  - kind: ethereum
    name: DestPool
    network: base-sepolia
    source:
      address: "0x45944B08fea203a7469C82A690F68fabF85B8283"
      abi: DestPool
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Release
        - ChainStats
      abis:
        - name: DestPool
          file: ./abis/DestPool.json
      eventHandlers:
        - event: Released(indexed address,uint256,uint256,bytes32)
          handler: handleReleased
      file: ./src/mapping.ts
