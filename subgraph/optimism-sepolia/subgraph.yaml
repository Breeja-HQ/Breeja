specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: SourceVault
    network: optimism-sepolia
    source:
      address: "0x2d18B34880cc67DA1358f8963906492e0d01a567"
      abi: SourceVault
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Payment
        - ChainStats
      abis:
        - name: SourceVault
          file: ./abis/SourceVault.json
      eventHandlers:
        - event: PaymentRequested(indexed address,indexed address,uint256,uint256,uint256)
          handler: handlePaymentRequested
      file: ./src/mapping.ts
  - kind: ethereum
    name: DestPool
    network: optimism-sepolia
    source:
      address: "0xA5dd225Beb2Ec0009Fe143eb0B9309Ba07d23737"
      abi: DestPool
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Release
        - ChainStats
      abis:
        - name: DestPool
          file: ./abis/DestPool.json
      eventHandlers:
        - event: Released(indexed address,uint256,uint256,bytes32)
          handler: handleReleased
      file: ./src/mapping.ts
