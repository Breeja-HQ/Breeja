specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: SourceVault
    network: arbitrum-sepolia
    source:
      address: "0x5471bab4fC78A946cDC3142d852e54cBD83C181e"
      abi: SourceVault
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Payment
        - ChainStats
      abis:
        - name: SourceVault
          file: ./abis/SourceVault.json
      eventHandlers:
        - event: PaymentRequested(indexed address,indexed address,uint256,uint256,uint256)
          handler: handlePaymentRequested
      file: ./src/mapping.ts
  - kind: ethereum
    name: DestPool
    network: arbitrum-sepolia
    source:
      address: "0xaA45094129D06ab48AEf1e8251071067FC4FED5A"
      abi: DestPool
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Release
        - ChainStats
      abis:
        - name: DestPool
          file: ./abis/DestPool.json
      eventHandlers:
        - event: Released(indexed address,uint256,uint256,bytes32)
          handler: handleReleased
      file: ./src/mapping.ts
